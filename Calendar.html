  <script>
    const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    const THAI_DAYS = ['อา','จ','อ','พ','พฤ','ศ','ส'];

    let currentDate = new Date();
    let currentView = window.innerWidth < 640 ? 'agenda' : 'month';
    let currentCategory = 'all';
    let allEvents = [];

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      document.getElementById('toastMsg').textContent = msg;
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 2600);
    }

    async function loadEvents() {
      try {
        if (window.PlansRepo && typeof window.PlansRepo.fetchPlans === 'function') {
          const user = JSON.parse(localStorage.getItem('currentUser') || localStorage.getItem('supabase_user') || 'null');
          const data = await window.PlansRepo.fetchPlans(user?.email || '', false);
          if (Array.isArray(data)) {
            allEvents = data.map(item => ({
              id: item.id,
              title: item.title || 'ไม่มีชื่อ',
              date: (item.due_date || item.start_date || item.created_at || '').slice(0, 10),
              category: item.category || 'activity',
              description: item.description || '',
              raw: item
            }));
          }
        }
      } catch (e) {
        console.warn('Calendar load fallback:', e);
      }
      updateBentoHeader();
      renderCalendar();
    }

    function updateBentoHeader() {
      const todayStr = new Date().toISOString().slice(0, 10);
      const upcoming = allEvents.filter(e => e.date >= todayStr).sort((a, b) => a.date.localeCompare(b.date));
      const nextEv = upcoming[0];
      const nextTitle = document.getElementById('bentoNextTitle');
      const nextCd = document.getElementById('bentoNextCountdown');

      if (nextEv) {
        nextTitle.textContent = nextEv.title;
        const diffDays = Math.ceil((new Date(nextEv.date) - new Date(todayStr)) / 86400000);
        nextCd.textContent = diffDays === 0 ? 'วันนี้ (Today)' : `อีก ${diffDays} วัน (${nextEv.date})`;
      } else {
        nextTitle.textContent = 'ไม่มีกำหนดการที่กำลังจะถึง';
        nextCd.textContent = 'ผ่อนคลายได้เลย';
      }

      const ym = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
      const monthEvents = allEvents.filter(e => (e.date || '').startsWith(ym));
      document.getElementById('bentoMonthCount').textContent = monthEvents.length;

      // 5-week Workload Heatmap
      const heatmap = document.getElementById('bentoHeatmap');
      const weeks = [0, 0, 0, 0, 0];
      monthEvents.forEach(e => {
        const d = parseInt(e.date.slice(8, 10), 10) || 1;
        weeks[Math.min(4, Math.floor((d - 1) / 7))]++;
      });
      heatmap.innerHTML = weeks.map((cnt, idx) => {
        const cls = cnt === 0 ? 'bg-slate-100 text-slate-400' : cnt <= 2 ? 'bg-orange-100 text-orange-700' : 'bg-orange-500 text-white';
        return `<div class="rounded-lg py-1.5 text-center text-[10px] font-mono font-semibold ${cls}" title="สัปดาห์ที่ ${idx + 1}: ${cnt} กิจกรรม">W${idx + 1} (${cnt})</div>`;
      }).join('');
    }

    function getFilteredEvents() {
      const q = (document.getElementById('calSearchInput')?.value || '').toLowerCase().trim();
      return allEvents.filter(ev => {
        const matchCat = currentCategory === 'all' || ev.category === currentCategory;
        const matchQ = !q || ev.title.toLowerCase().includes(q) || (ev.description || '').toLowerCase().includes(q);
        return matchCat && matchQ;
      });
    }

    function getStatusBadge(dateStr) {
      if (!dateStr) return { label: 'ไม่ระบุวัน', cls: 'bg-slate-100 text-slate-600' };
      const today = new Date().toISOString().slice(0, 10);
      if (dateStr === today) return { label: 'วันนี้', cls: 'bg-orange-100 text-orange-700' };
      if (dateStr < today) return { label: 'เลยกำหนด', cls: 'bg-rose-100 text-rose-700' };
      return { label: 'กำลังจะถึง', cls: 'bg-emerald-100 text-emerald-700' };
    }

    function setView(v) {
      currentView = v;
      ['month', 'week', 'agenda'].forEach(mode => {
        const btn = document.getElementById('btnView' + mode.charAt(0).toUpperCase() + mode.slice(1));
        if (btn) {
          btn.className = mode === v
            ? 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-900 shadow-xs cursor-pointer'
            : 'px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 cursor-pointer';
        }
      });
      renderCalendar();
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = btn.dataset.cat === cat
          ? 'cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white cursor-pointer'
          : 'cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 cursor-pointer';
      });
      renderCalendar();
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      updateBentoHeader();
      renderCalendar();
    }

    function goToToday() {
      currentDate = new Date();
      updateBentoHeader();
      renderCalendar();
    }

    function renderCalendar() {
      const label = document.getElementById('currentMonthLabel');
      const container = document.getElementById('calendarViewContainer');
      if (!container) return;

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      if (label) label.textContent = `${THAI_MONTHS[month]} ${year + 543}`;

      const events = getFilteredEvents();

      if (currentView === 'agenda') {
        if (events.length === 0) {
          container.innerHTML = `<div class="p-12 text-center text-slate-400 text-sm">ไม่พบกิจกรรมที่ตรงกับเงื่อนไข</div>`;
          return;
        }
        const sorted = [...events].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        container.innerHTML = `
          <div class="divide-y divide-slate-100">
            ${sorted.map(ev => {
              const st = getStatusBadge(ev.date);
              return `
                <div onclick='openDetailModal(${JSON.stringify(ev).replace(/'/g, "&#39;")})' class="p-4 hover:bg-slate-50 transition flex items-center justify-between gap-4 cursor-pointer">
                  <div class="min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${st.cls}">${st.label}</span>
                      <span class="text-xs font-mono text-slate-500">${ev.date || '-'}</span>
                    </div>
                    <h3 class="text-sm font-bold text-slate-900 truncate">${ev.title}</h3>
                    ${ev.description ? `<p class="text-xs text-slate-500 truncate mt-0.5">${ev.description}</p>` : ''}
                  </div>
                  <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 flex-shrink-0"></i>
                </div>
              `;
            }).join('')}
          </div>
        `;
        if (window.lucide) lucide.createIcons();
        return;
      }

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = new Date().toISOString().slice(0, 10);

      let html = `<div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50">
        ${THAI_DAYS.map(d => `<div class="py-2.5 text-center text-xs font-semibold text-slate-500">${d}</div>`).join('')}
      </div><div class="grid grid-cols-7 divide-x divide-y divide-slate-100">`;

      for (let i = 0; i < firstDay; i++) {
        html += `<div class="cal-cell bg-slate-50/50 p-1.5"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayEvents = events.filter(e => e.date === dateStr);
        const isToday = dateStr === todayStr;

        html += `
          <div class="cal-cell p-1.5 sm:p-2 hover:bg-slate-50/80">
            <div class="flex items-center justify-between mb-1">
              <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-semibold ${isToday ? 'bg-orange-600 text-white' : 'text-slate-700'}">${day}</span>
            </div>
            <div class="space-y-1">
              ${dayEvents.slice(0, 3).map(ev => `
                <div onclick='openDetailModal(${JSON.stringify(ev).replace(/'/g, "&#39;")})' class="px-1.5 py-0.5 rounded bg-orange-50 border border-orange-200/70 text-[10px] font-medium text-orange-800 truncate cursor-pointer hover:bg-orange-100">
                  ${ev.title}
                </div>
              `).join('')}
              ${dayEvents.length > 3 ? `<div class="text-[10px] text-slate-400 font-medium pl-1">+${dayEvents.length - 3} เพิ่มเติม</div>` : ''}
            </div>
          </div>
        `;
      }
      html += `</div>`;
      container.innerHTML = html;
      if (window.lucide) lucide.createIcons();
    }

    function openDetailModal(ev) {
      const modal = document.getElementById('eventDetailModal');
      if (!modal) return;
      const st = getStatusBadge(ev.date);
      document.getElementById('detailBadge').textContent = st.label;
      document.getElementById('detailBadge').className = `inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold mb-2 ${st.cls}`;
      document.getElementById('detailTitle').textContent = ev.title;
      document.getElementById('detailDate').textContent = ev.date || 'ไม่ระบุวันที่';
      document.getElementById('detailDescWrap').textContent = ev.description || 'ไม่มีรายละเอียดเพิ่มเติม';
      document.getElementById('btnExportIcs').onclick = () => { window.CalendarSync?.downloadIcsFile(ev.raw || ev); showToast('ดาวน์โหลดไฟล์ .ics แล้ว'); };
      document.getElementById('btnGoogleCal').onclick = () => window.CalendarSync?.openGoogleCalendar(ev.raw || ev);
      modal.classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }

    function closeDetailModal() { document.getElementById('eventDetailModal')?.classList.add('hidden'); }
    function openAddModal() { document.getElementById('evDate').value = new Date().toISOString().slice(0, 10); document.getElementById('addEventModal')?.classList.remove('hidden'); }
    function closeAddModal() { document.getElementById('addEventModal')?.classList.add('hidden'); }

    async function handleAddEvent(e) {
      e.preventDefault();
      const title = document.getElementById('evTitle').value.trim();
      const date = document.getElementById('evDate').value;
      const category = document.getElementById('evCategory').value;
      const description = document.getElementById('evDesc').value.trim();
      if (!title || !date) return;

      const newEv = { id: crypto.randomUUID(), title, due_date: date, category, description, status: 'todo' };
      try {
        if (window.PlansRepo && typeof window.PlansRepo.savePlan === 'function') await window.PlansRepo.savePlan(newEv);
      } catch (err) { console.warn('Save event fallback:', err); }
      allEvents.unshift({ id: newEv.id, title, date, category, description, raw: newEv });
      closeAddModal();
      document.getElementById('addEventForm').reset();
      updateBentoHeader();
      renderCalendar();
      showToast('เพิ่มกิจกรรมใหม่เรียบร้อย');
    }

    // Cmd+K Command Palette
    function openCmdPalette() {
      document.getElementById('cmdPaletteModal')?.classList.remove('hidden');
      const inp = document.getElementById('cmdInput');
      inp.value = '';
      inp.focus();
      renderCmdResults();
    }
    function closeCmdPalette() { document.getElementById('cmdPaletteModal')?.classList.add('hidden'); }
    function renderCmdResults() {
      const q = (document.getElementById('cmdInput')?.value || '').toLowerCase().trim();
      const res = document.getElementById('cmdResults');
      const actions = [
        { label: '➕ เพิ่มกิจกรรมใหม่', fn: () => { closeCmdPalette(); openAddModal(); } },
        { label: '📅 มุมมองเดือน (Month)', fn: () => { closeCmdPalette(); setView('month'); } },
        { label: '📋 มุมมองรายการ (Agenda)', fn: () => { closeCmdPalette(); setView('agenda'); } }
      ];
      const matched = allEvents.filter(e => !q || e.title.toLowerCase().includes(q)).slice(0, 5);
      res.innerHTML = [
        ...actions.map((a, i) => `<button onclick="cmdActions[${i}]()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-100 font-medium text-slate-700 cursor-pointer">${a.label}</button>`),
        ...matched.map(e => `<button onclick='closeCmdPalette(); openDetailModal(${JSON.stringify(e).replace(/'/g, "&#39;")})' class="w-full text-left px-3 py-2 rounded-lg hover:bg-orange-50 text-slate-800 flex justify-between cursor-pointer"><span class="truncate">${e.title}</span><span class="font-mono text-slate-400">${e.date}</span></button>`)
      ].join('');
      window.cmdActions = actions.map(a => a.fn);
    }

    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmdPalette(); }
      if (e.key === 'Escape') { closeCmdPalette(); closeDetailModal(); closeAddModal(); }
    });

    document.addEventListener('DOMContentLoaded', () => {
      setView(currentView);
      setCategory('all');
      loadEvents();
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
