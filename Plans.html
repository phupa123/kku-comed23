<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>แผนงานและงานโปรเจกต์ — KKU COMED 23</title>
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Icons & Tailwind -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Sarabun"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }

  <!-- Core App Scripts -->
  <script src="assets/js/maintenance-guard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config/supabase_config.js"></script>
  <script src="students_data.js"></script>
  <script src="assets/js/plans_repo.js"></script>
  <script src="assets/js/calendar_sync.js"></script>
  <script src="assets/js/notifications.js"></script>

  <style>
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-20 lg:pb-8">

  <!-- Top Navbar -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2.5">
        <img src="logo.png" alt="COMED 23" class="w-8 h-8 rounded-lg object-contain border border-slate-200 p-0.5 bg-white">
        <div>
          <span class="font-bold text-sm text-slate-900 block leading-tight">KKU COMED 23</span>
          <span class="text-[11px] text-slate-500 font-mono">Plans &amp; Focus</span>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-1 text-sm font-medium">
        <a href="index.html" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">หน้าหลัก</a>
        <a href="Calendar.html" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">ปฏิทิน</a>
        <a href="Plans.html" class="px-3 py-1.5 rounded-lg bg-orange-50 text-orange-700 font-semibold">แผนงาน (Plans)</a>
        <a href="storage.html" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">คลังไฟล์</a>
      </nav>

      <div class="flex items-center gap-2">
        <button onclick="openCmdPalette()" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-xs text-slate-500 transition cursor-pointer">
          <i data-lucide="search" class="w-3.5 h-3.5"></i>
          <span>ค้นหาด่วน</span>
          <kbd class="px-1.5 py-0.5 rounded bg-white border border-slate-200 font-mono text-[10px] text-slate-400">⌘K</kbd>
        </button>
        <button onclick="openTaskModal()" class="px-3.5 py-2 rounded-xl bg-orange-600 hover:bg-orange-700 text-white text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 shadow-sm cursor-pointer">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>เพิ่มงานใหม่</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-5">

    <!-- Executive Bento Dashboard -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <!-- KPI Summary -->
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-xs flex items-center justify-between">
        <div>
          <span class="text-[11px] font-mono font-semibold uppercase tracking-wider text-slate-400">ภาพรวมงาน</span>
          <div class="flex items-baseline gap-3 mt-1">
            <span id="kpiActive" class="text-2xl font-extrabold text-slate-900 font-mono">0</span>
            <span class="text-xs text-slate-500">กำลังทำ</span>
            <span class="text-slate-300">|</span>
            <span id="kpiDone" class="text-lg font-bold text-emerald-600 font-mono">0</span>
            <span class="text-xs text-slate-500">เสร็จแล้ว</span>
          </div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-orange-50 text-orange-600 flex items-center justify-center">
          <i data-lucide="layers" class="w-5 h-5"></i>
        </div>
      </div>

      <!-- Overall Completion -->
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-xs flex flex-col justify-between">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-mono font-semibold uppercase tracking-wider text-slate-400">Completion Rate</span>
          <span id="kpiPercent" class="text-xs font-mono font-bold text-orange-600">0%</span>
        </div>
        <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden mt-3">
          <div id="kpiProgressBar" class="h-full bg-orange-500 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>

      <!-- Built-in Focus Timer (Pomodoro) -->
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-xs flex items-center justify-between">
        <div>
          <span class="text-[11px] font-mono font-semibold uppercase tracking-wider text-orange-600">Focus Timer</span>
          <div id="focusTimerDisplay" class="text-2xl font-extrabold text-slate-900 font-mono mt-0.5">25:00</div>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="toggleTimer()" id="btnTimerToggle" class="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold cursor-pointer">เริ่ม</button>
          <button onclick="resetTimer()" class="p-1.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-500 cursor-pointer" title="รีเซ็ต">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="inline-flex p-1 rounded-xl bg-slate-100 border border-slate-200 self-start">
          <button onclick="setTab('active')" id="tabActive" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer">กำลังทำ (Active)</button>
          <button onclick="setTab('completed')" id="tabCompleted" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer">เสร็จแล้ว (Completed)</button>
        </div>

        <div class="inline-flex p-1 rounded-xl bg-slate-100 border border-slate-200 self-start sm:self-auto">
          <button onclick="setView('kanban')" id="btnViewKanban" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer">Kanban</button>
          <button onclick="setView('list')" id="btnViewList" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer">List</button>
          <button onclick="setView('table')" id="btnViewTable" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer">Table</button>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-2 border-t border-slate-100">
        <div class="relative flex-1 max-w-md">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="plansSearchInput" oninput="renderPlans()" placeholder="ค้นหางาน, รายวิชา, ผู้รับผิดชอบ..."
            class="w-full pl-9 pr-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-orange-500 transition">
        </div>

        <div class="flex items-center gap-1.5 overflow-x-auto">
          <button onclick="setPriority('all')" data-prio="all" class="prio-btn px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer">ทั้งหมด</button>
          <button onclick="setPriority('high')" data-prio="high" class="prio-btn px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer">ด่วน (High)</button>
          <button onclick="setPriority('medium')" data-prio="medium" class="prio-btn px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer">ปานกลาง</button>
          <button onclick="setPriority('low')" data-prio="low" class="prio-btn px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer">ทั่วไป</button>
        </div>
      </div>
    </div>

    <!-- Plans Container -->
    <div id="plansContainer">
      <div class="bg-white border border-slate-200 rounded-2xl p-12 text-center text-slate-400 text-sm">กำลังโหลดข้อมูลแผนงาน...</div>
    </div>

  </main>

  <!-- Quick Add / Edit Task Modal -->
  <div id="taskModal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4" onclick="closeTaskModal()">
    <div class="bg-white border border-slate-200 rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-900">เพิ่ม / แก้ไขงาน</h2>
        <button onclick="closeTaskModal()" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-700 cursor-pointer">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <form id="taskForm" onsubmit="handleSaveTask(event)" class="space-y-3.5">
        <input type="hidden" id="taskId">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">ชื่องาน *</label>
          <input type="text" id="taskTitle" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-orange-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">กำหนดส่ง</label>
            <input type="date" id="taskDue" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-orange-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">ความสำคัญ</label>
            <select id="taskPrio" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-orange-500 bg-white">
              <option value="medium">ปานกลาง (Medium)</option>
              <option value="high">ด่วน (High)</option>
              <option value="low">ทั่วไป (Low)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">สถานะ</label>
          <select id="taskStatus" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-orange-500 bg-white">
            <option value="todo">รอดำเนินการ (To Do)</option>
            <option value="in_progress">กำลังทำ (In Progress)</option>
            <option value="done">เสร็จสิ้น (Done)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">รายละเอียด</label>
          <textarea id="taskDesc" rows="2" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-orange-500"></textarea>
        </div>

        <!-- Subtasks Checklist -->
        <div class="pt-2 border-t border-slate-100 space-y-2">
          <label class="block text-xs font-semibold text-slate-700">เช็กลิสต์ย่อย (Subtasks)</label>
          <div id="subtasksList" class="space-y-1.5"></div>
          <div class="flex gap-2">
            <input type="text" id="newSubtaskInput" placeholder="เพิ่มขั้นตอนย่อย..." class="flex-1 px-3 py-1.5 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-orange-500">
            <button type="button" onclick="addSubtask()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 cursor-pointer">เพิ่ม</button>
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeTaskModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 cursor-pointer">ยกเลิก</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-orange-600 hover:bg-orange-700 text-white text-xs font-semibold cursor-pointer">บันทึกงาน</button>
        </div>
      </form>
    </div>

  <!-- Cmd+K Command Palette -->
  <div id="cmdPaletteModal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-start justify-center pt-20 p-4" onclick="closeCmdPalette()">
    <div class="bg-white border border-slate-200 rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden" onclick="event.stopPropagation()">
      <div class="flex items-center gap-2 px-4 py-3 border-b border-slate-100">
        <i data-lucide="command" class="w-4 h-4 text-slate-400"></i>
        <input type="text" id="cmdInput" oninput="renderCmdResults()" placeholder="พิมพ์คำสั่ง หรือค้นหางาน..." class="w-full text-sm text-slate-800 focus:outline-none">
        <kbd class="px-1.5 py-0.5 rounded bg-slate-100 text-[10px] font-mono text-slate-500">ESC</kbd>
      </div>
      <div id="cmdResults" class="max-h-72 overflow-y-auto divide-y divide-slate-100 p-2 text-xs"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toastBox" class="hidden fixed bottom-20 lg:bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-medium flex items-center gap-2">
    <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
    <span id="toastMsg">บันทึกเรียบร้อย</span>
  </div>

  <!-- Mobile Bottom Nav -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-2 flex items-center justify-around">
    <a href="index.html" class="flex flex-col items-center gap-0.5 text-slate-500 hover:text-slate-900">
      <i data-lucide="home" class="w-4 h-4"></i>
      <span class="text-[10px] font-medium">หน้าหลัก</span>
    </a>
    <a href="Calendar.html" class="flex flex-col items-center gap-0.5 text-slate-500 hover:text-slate-900">
      <i data-lucide="calendar" class="w-4 h-4"></i>
      <span class="text-[10px] font-medium">ปฏิทิน</span>
    </a>
    <a href="Plans.html" class="flex flex-col items-center gap-0.5 text-orange-600 font-semibold">
      <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
      <span class="text-[10px]">แผนงาน</span>
    </a>
    <a href="Profile.html" class="flex flex-col items-center gap-0.5 text-slate-500 hover:text-slate-900">
      <i data-lucide="user" class="w-4 h-4"></i>
      <span class="text-[10px] font-medium">โปรไฟล์</span>
    </a>
  </nav>

  <script>
    let allPlans = [];
    let currentTab = 'active';
    let currentView = window.innerWidth < 768 ? 'list' : 'kanban';
    let currentPrio = 'all';
    let modalSubtasks = [];

    // Focus Timer State
    let timerSeconds = 25 * 60;
    let timerInterval = null;

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      document.getElementById('toastMsg').textContent = msg;
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 2600);
    }

    function updateTimerUI() {
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById('focusTimerDisplay').textContent = `${m}:${s}`;
    }

    function toggleTimer() {
      const btn = document.getElementById('btnTimerToggle');
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        btn.textContent = 'เริ่ม';
      } else {
        btn.textContent = 'พัก';
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerUI();
          } else {
            clearInterval(timerInterval);
            timerInterval = null;
            btn.textContent = 'เริ่ม';
            showToast('ครบเวลา Focus 25 นาทีแล้ว!');
          }
        }, 1000);
      }
    }

    function resetTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      timerSeconds = 25 * 60;
      document.getElementById('btnTimerToggle').textContent = 'เริ่ม';
      updateTimerUI();
    }

    async function loadPlans() {
      try {
        if (window.PlansRepo && typeof window.PlansRepo.fetchPlans === 'function') {
          const user = JSON.parse(localStorage.getItem('currentUser') || localStorage.getItem('supabase_user') || 'null');
          const data = await window.PlansRepo.fetchPlans(user?.email || '', false);
          if (Array.isArray(data)) {
            allPlans = data.map(p => ({
              id: p.id,
              title: p.title || 'ไม่มีชื่อ',
              description: p.description || '',
              due_date: (p.due_date || '').slice(0, 10),
              priority: p.priority || 'medium',
              status: p.status || 'todo',
              progress: typeof p.progress === 'number' ? p.progress : (p.status === 'done' ? 100 : p.status === 'in_progress' ? 50 : 0),
              subtasks: Array.isArray(p.subtasks) ? p.subtasks : [],
              raw: p
            }));
          }
        }
      } catch (e) { console.warn('Plans load fallback:', e); }
      updateBentoKPIs();
      renderPlans();
    }

    function updateBentoKPIs() {
      const doneCount = allPlans.filter(p => p.status === 'done').length;
      const activeCount = allPlans.length - doneCount;
      const pct = allPlans.length ? Math.round((doneCount / allPlans.length) * 100) : 0;
      document.getElementById('kpiActive').textContent = activeCount;
      document.getElementById('kpiDone').textContent = doneCount;
      document.getElementById('kpiPercent').textContent = `${pct}%`;
      document.getElementById('kpiProgressBar').style.width = `${pct}%`;
    }

    function setTab(tab) {
      currentTab = tab;
      document.getElementById('tabActive').className = tab === 'active'
        ? 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-900 shadow-xs cursor-pointer'
        : 'px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 cursor-pointer';
      document.getElementById('tabCompleted').className = tab === 'completed'
        ? 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-900 shadow-xs cursor-pointer'
        : 'px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 cursor-pointer';
      renderPlans();
    }

    function setView(v) {
      currentView = v;
      ['kanban', 'list', 'table'].forEach(mode => {
        const btn = document.getElementById('btnView' + mode.charAt(0).toUpperCase() + mode.slice(1));
        if (btn) {
          btn.className = mode === v
            ? 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-900 shadow-xs cursor-pointer'
            : 'px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 cursor-pointer';
        }
      });
      renderPlans();
    }

    function setPriority(prio) {
      currentPrio = prio;
      document.querySelectorAll('.prio-btn').forEach(btn => {
        btn.className = btn.dataset.prio === prio
          ? 'prio-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white cursor-pointer'
          : 'prio-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 cursor-pointer';
      });
      renderPlans();
    }

    function getFilteredPlans() {
      const q = (document.getElementById('plansSearchInput')?.value || '').toLowerCase().trim();
      return allPlans.filter(p => {
        const isDone = p.status === 'done';
        const matchTab = currentTab === 'completed' ? isDone : !isDone;
        const matchPrio = currentPrio === 'all' || p.priority === currentPrio;
        const matchQ = !q || p.title.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q);
        return matchTab && matchPrio && matchQ;
      });
    }

    function prioBadge(prio) {
      if (prio === 'high') return '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-rose-100 text-rose-700">High</span>';
      if (prio === 'low') return '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 text-slate-600">Low</span>';
      return '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-100 text-amber-700">Medium</span>';
    }

    function renderCard(p) {
      return `
        <div onclick='openTaskModal(${JSON.stringify(p).replace(/'/g, "&#39;")})' class="bg-white border border-slate-200 hover:border-orange-300 rounded-xl p-4 shadow-xs hover:shadow-md transition cursor-pointer space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            ${prioBadge(p.priority)}
            <span class="text-[11px] font-mono text-slate-400">${p.due_date || 'ไม่มีกำหนด'}</span>
          </div>
          <h3 class="text-sm font-bold text-slate-900 line-clamp-2">${p.title}</h3>
          ${p.description ? `<p class="text-xs text-slate-500 line-clamp-2">${p.description}</p>` : ''}
          <div class="pt-1">
            <div class="flex justify-between text-[10px] text-slate-500 mb-1">
              <span>ความคืบหน้า</span>
              <span class="font-mono font-semibold">${p.progress}%</span>
            </div>
            <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
              <div class="h-full bg-orange-500 rounded-full" style="width: ${p.progress}%"></div>
            </div>
          </div>
        </div>
      `;
    }

    function renderPlans() {
      const container = document.getElementById('plansContainer');
      if (!container) return;
      const items = getFilteredPlans();

      if (items.length === 0) {
        container.innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl p-12 text-center text-slate-400 text-sm">ไม่พบรายการงานในหมวดหมู่นี้</div>`;
        return;
      }

      if (currentView === 'kanban') {
        const cols = [
          { key: 'todo', label: 'รอดำเนินการ (To Do)' },
          { key: 'in_progress', label: 'กำลังทำ (In Progress)' },
          { key: 'done', label: 'เสร็จสิ้น (Done)' }
        ];
        container.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            ${cols.map(c => {
              const colItems = items.filter(i => i.status === c.key);
              return `
                <div class="bg-slate-100/70 border border-slate-200/80 rounded-2xl p-3.5 space-y-3">
                  <div class="flex items-center justify-between px-1">
                    <span class="text-xs font-bold text-slate-700">${c.label}</span>
                    <span class="px-2 py-0.5 rounded-full bg-white border border-slate-200 text-[10px] font-mono text-slate-600">${colItems.length}</span>
                  </div>
                  <div class="space-y-2.5">
                    ${colItems.length ? colItems.map(renderCard).join('') : '<div class="text-center py-6 text-xs text-slate-400">ไม่มีงาน</div>'}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (currentView === 'table') {
        container.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-2xl overflow-x-auto shadow-xs">
            <table class="w-full text-left border-collapse text-xs sm:text-sm">
              <thead>
                <tr class="border-b border-slate-200 bg-slate-50 text-slate-600">
                  <th class="py-3 px-4 font-semibold">ชื่องาน</th>
                  <th class="py-3 px-4 font-semibold">ความสำคัญ</th>
                  <th class="py-3 px-4 font-semibold">กำหนดส่ง</th>
                  <th class="py-3 px-4 font-semibold">ความคืบหน้า</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${items.map(p => `
                  <tr onclick='openTaskModal(${JSON.stringify(p).replace(/'/g, "&#39;")})' class="hover:bg-slate-50 cursor-pointer">
                    <td class="py-3 px-4 font-semibold text-slate-900">${p.title}</td>
                    <td class="py-3 px-4">${prioBadge(p.priority)}</td>
                    <td class="py-3 px-4 font-mono text-xs text-slate-500">${p.due_date || '-'}</td>
                    <td class="py-3 px-4 font-mono text-xs text-slate-700">${p.progress}%</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else {
        container.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">${items.map(renderCard).join('')}</div>`;
      }
      if (window.lucide) lucide.createIcons();
    }

    function renderSubtasks() {
      const list = document.getElementById('subtasksList');
      list.innerHTML = modalSubtasks.map((s, idx) => `
        <div class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-100 text-xs">
          <label class="flex items-center gap-2 cursor-pointer flex-1">
            <input type="checkbox" ${s.done ? 'checked' : ''} onchange="modalSubtasks[${idx}].done = this.checked" class="rounded text-orange-600">
            <span class="${s.done ? 'line-through text-slate-400' : 'text-slate-700'}">${s.text}</span>
          </label>
          <button type="button" onclick="modalSubtasks.splice(${idx}, 1); renderSubtasks();" class="text-slate-400 hover:text-rose-500 cursor-pointer">×</button>
        </div>
      `).join('');
    }

    function addSubtask() {
      const inp = document.getElementById('newSubtaskInput');
      const val = inp.value.trim();
      if (!val) return;
      modalSubtasks.push({ text: val, done: false });
      inp.value = '';
      renderSubtasks();
    }

    function openTaskModal(p = null) {
      document.getElementById('taskId').value = p?.id || '';
      document.getElementById('taskTitle').value = p?.title || '';
      document.getElementById('taskDue').value = p?.due_date || new Date().toISOString().slice(0, 10);
      document.getElementById('taskPrio').value = p?.priority || 'medium';
      document.getElementById('taskStatus').value = p?.status || 'todo';
      document.getElementById('taskDesc').value = p?.description || '';
      modalSubtasks = Array.isArray(p?.subtasks) ? JSON.parse(JSON.stringify(p.subtasks)) : [];
      renderSubtasks();
      document.getElementById('taskModal')?.classList.remove('hidden');
    }

    function closeTaskModal() { document.getElementById('taskModal')?.classList.add('hidden'); }

    async function handleSaveTask(e) {
      e.preventDefault();
      const id = document.getElementById('taskId').value || crypto.randomUUID();
      const title = document.getElementById('taskTitle').value.trim();
      const due_date = document.getElementById('taskDue').value;
      const priority = document.getElementById('taskPrio').value;
      const status = document.getElementById('taskStatus').value;
      const description = document.getElementById('taskDesc').value.trim();
      let progress = status === 'done' ? 100 : status === 'in_progress' ? 50 : 0;
      if (modalSubtasks.length > 0) {
        progress = Math.round((modalSubtasks.filter(s => s.done).length / modalSubtasks.length) * 100);
      }

      const payload = { id, title, due_date, priority, status, description, progress, subtasks: modalSubtasks };
      try {
        if (window.PlansRepo && typeof window.PlansRepo.savePlan === 'function') await window.PlansRepo.savePlan(payload);
      } catch (err) { console.warn('Save plan fallback:', err); }

      const idx = allPlans.findIndex(x => x.id === id);
      if (idx >= 0) allPlans[idx] = { ...payload, raw: payload };
      else allPlans.unshift({ ...payload, raw: payload });

      closeTaskModal();
      updateBentoKPIs();
      renderPlans();
      showToast('บันทึกงานเรียบร้อย');
    }

    // Cmd+K Command Palette
    function openCmdPalette() {
      document.getElementById('cmdPaletteModal')?.classList.remove('hidden');
      const inp = document.getElementById('cmdInput');
      inp.value = '';
      inp.focus();
      renderCmdResults();
    }
    function closeCmdPalette() { document.getElementById('cmdPaletteModal')?.classList.add('hidden'); }
    function renderCmdResults() {
      const q = (document.getElementById('cmdInput')?.value || '').toLowerCase().trim();
      const res = document.getElementById('cmdResults');
      const actions = [
        { label: '➕ เพิ่มงานใหม่', fn: () => { closeCmdPalette(); openTaskModal(); } },
        { label: '📌 มุมมอง Kanban', fn: () => { closeCmdPalette(); setView('kanban'); } },
        { label: '📋 มุมมอง List', fn: () => { closeCmdPalette(); setView('list'); } },
        { label: '📊 มุมมอง Table', fn: () => { closeCmdPalette(); setView('table'); } }
      ];
      const matched = allPlans.filter(p => !q || p.title.toLowerCase().includes(q)).slice(0, 5);
      res.innerHTML = [
        ...actions.map((a, i) => `<button onclick="cmdActions[${i}]()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-100 font-medium text-slate-700 cursor-pointer">${a.label}</button>`),
        ...matched.map(p => `<button onclick='closeCmdPalette(); openTaskModal(${JSON.stringify(p).replace(/'/g, "&#39;")})' class="w-full text-left px-3 py-2 rounded-lg hover:bg-orange-50 text-slate-800 flex justify-between cursor-pointer"><span class="truncate">${p.title}</span><span class="font-mono text-slate-400">${p.progress}%</span></button>`)
      ].join('');
      window.cmdActions = actions.map(a => a.fn);
    }

    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmdPalette(); }
      if (e.key === 'Escape') { closeCmdPalette(); closeTaskModal(); }
    });

    document.addEventListener('DOMContentLoaded', () => {
      setTab('active');
      setView(currentView);
      setPriority('all');
      loadPlans();
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
